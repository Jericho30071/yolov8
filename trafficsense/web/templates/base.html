<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrafficSense</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">TrafficSense</div>
  <nav>
    <a href="/" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
    <a href="/camera" class="{{ 'on' if page == 'camera' }}">Camera</a>
    <a href="/controls" class="{{ 'on' if page == 'controls' }}">Controls</a>
    <a href="/logs" class="{{ 'on' if page == 'logs' }}">Logs</a>
    <a href="/settings" class="{{ 'on' if page == 'settings' }}">Settings</a>
  </nav>
  <div class="who"><span id="conn" class="dot"></span> {{ user.username }} ({{ user.role }}) · <a href="/logout">Log out</a></div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
